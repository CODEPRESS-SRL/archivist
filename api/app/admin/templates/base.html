<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivist Admin{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin">Archivist Admin</a>
    {% if admin %}
    <nav><span class="team">{{ admin.team_name }}</span>
      <form class="inline logout" method="post" action="/admin/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit">logout</button>
      </form></nav>
    {% endif %}
  </header>
  <main>
    {% if msg %}<p class="flash">{{ msg }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
