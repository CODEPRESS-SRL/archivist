{% extends "base.html" %}
{% block content %}
<h1>Projects</h1>
<form method="get" action="/admin/search" class="searchbar">
  <input type="search" name="q" placeholder="search all projects (what the agent sees)…">
  <input type="hidden" name="scope" value="all">
  <button type="submit">Search all</button>
</form>
<p>
  <a href="/admin/reports/stale">Stale report</a> ·
  <a href="/admin/reports/duplicates">Duplicate keywords</a>
</p>
{% if not projects %}<p>No projects yet.</p>{% endif %}
<table>
  <thead><tr><th>Project</th><th>Entries</th></tr></thead>
  <tbody>
  {% for p in projects %}
    <tr>
      <td><a href="/admin/projects/{{ p.slug }}">{{ p.slug }}</a></td>
      <td>{{ p.memory_count }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
