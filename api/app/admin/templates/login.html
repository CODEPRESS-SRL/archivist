{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login">
  <label>Team API key
    <input type="password" name="api_key" autocomplete="off" autofocus required>
  </label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
