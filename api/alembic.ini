# Alembic configuration for the Archivist API.
# The database URL is NOT set here: env.py reads it from app.config.Settings
# (DATABASE_URL) so migrations and the app share one source of truth.

[alembic]
script_location = alembic

# Prepend the project root (/app in the container, api/ on the host) to
# sys.path so env.py can `import app.config` / `import app.models`.
prepend_sys_path = .

# Keep generated revision filenames readable: <rev>_<slug>.py
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
