version: 2

updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      python-api:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /benchmark
    schedule:
      interval: weekly
    groups:
      python-benchmark:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /companion
    schedule:
      interval: weekly
    groups:
      npm-companion:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
