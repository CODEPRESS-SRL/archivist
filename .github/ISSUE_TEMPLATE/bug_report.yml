name: Bug report
description: Report something that does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Archivist version
      description: Server version (for example 1.2.0) or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: deploy-mode
    attributes:
      label: Deploy mode
      options:
        - dev (docker-compose.yml)
        - prod (docker-compose.prod.yml)
        - service-only mode behind a trusted gateway
    validations:
      required: true
  - type: input
    id: mcp-client
    attributes:
      label: MCP client and version
      description: For example Claude Code 2.0.0, Codex, Cursor.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example Ubuntu 24.04, macOS 15, Windows 11.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server or client logs. Redact API keys and any other secrets before pasting.
      render: shell
    validations:
      required: false
